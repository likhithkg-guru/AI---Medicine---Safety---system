<!DOCTYPE html>
<html>

<head>

    <title>Register Complaint</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:linear-gradient(to right,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            color:white;
        }

        .navbar{
            width:100%;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            box-shadow:0px 2px 10px rgba(0,0,0,0.3);
        }

        .logo{
            font-size:30px;
            font-weight:bold;
            color:#00e5ff;
        }

        .nav-links a{
            text-decoration:none;
            color:white;
            margin-left:25px;
            font-size:18px;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#00e5ff;
        }

        .main-container{
            display:flex;
            justify-content:center;
            align-items:center;
            padding:50px;
        }

        .complaint-box{
            width:750px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border-radius:30px;
            padding:45px;
            box-shadow:0px 0px 25px rgba(0,0,0,0.4);
        }

        .complaint-box h1{
            text-align:center;
            font-size:50px;
            color:#00e5ff;
            margin-bottom:15px;
        }

        .complaint-box p{
            text-align:center;
            color:#dcdcdc;
            margin-bottom:35px;
            font-size:18px;
        }

        input, textarea{

            width:100%;
            padding:18px;

            margin-bottom:25px;

            border:none;

            border-radius:15px;

            font-size:18px;

            outline:none;

            background:rgba(255,255,255,0.12);

            color:white;
        }

        textarea{
            height:140px;
            resize:none;
        }

        input::placeholder,
        textarea::placeholder{
            color:#ddd;
        }

        .submit-btn{

            width:100%;

            padding:18px;

            border:none;

            border-radius:18px;

            background:#ff4b5c;

            color:white;

            font-size:22px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .submit-btn:hover{

            transform:scale(1.03);

            box-shadow:0px 0px 20px #ff4b5c;
        }

        .success{

            margin-top:30px;

            background:rgba(0,255,153,0.1);

            border:2px solid #00ff99;

            padding:20px;

            border-radius:18px;

            text-align:center;

            font-size:24px;

            font-weight:bold;

            color:#00ff99;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            MedSafe AI
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/scanner">Scanner</a>

            <a href="/medicine_info">Medicine Info</a>

            <a href="/complaint">Complaint</a>

            <a href="/view_complaints">Complaints</a>

            <a href="/about">About</a>

        </div>

    </div>

    <div class="main-container">

        <div class="complaint-box">

            <h1>Register Complaint</h1>

            <p>

                Report suspicious medicines or medical shops
                to improve healthcare safety.

            </p>

            <form method="POST">

                <input
                type="text"
                name="shop"
                placeholder="Enter Shop Name"
                required>

                <input
                type="text"
                name="location"
                placeholder="Enter Shop Location"
                required>

                <input
                type="text"
                name="medicine"
                placeholder="Enter Medicine Name"
                required>

                <textarea
                name="complaint"
                placeholder="Describe your complaint..."
                required></textarea>

                <button type="submit" class="submit-btn">

                    🚨 Submit Complaint

                </button>

            </form>

            {% if success %}

            <div class="success">

                ✅ Complaint Registered Successfully

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
